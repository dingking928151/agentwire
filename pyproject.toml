[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcodec"
version = "0.1.0"
description = "Offline reversible structured agent-message codec"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "typer>=0.12,<1", "tiktoken>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
